## Managed components pulled automatically by `idf.py` on first build.
dependencies:
  idf: ">=5.3"
  # LVGL 9 + ready-made glue for esp_lcd panels (display, buffers, tick, locking).
  espressif/esp_lvgl_port: "^2"
  # On-device speech: WakeNet / MultiNet / AFE for the ESP32-S3.
  espressif/esp-sr: ">=1.6.0,<2.0.0"
  # Software JPEG decoder for Wikipedia lead images.
  espressif/esp_new_jpeg: ">=0.5.0"
